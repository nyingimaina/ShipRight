# Deployment-server compose file (pull-only). Copy this to the root of your compose repo
# (the repo set as "Compose repo URL" on the server) as docker-compose.yml.
#
# The server never builds: it pulls the app image from ECR and mariadb from Docker Hub.
# The app tag is ${SHIPRIGHT_APP_TAG:-<default>}: the release pipeline rewrites the <default> after each image push, and
# the server can pin any other version (rollback) by setting SHIPRIGHT_APP_TAG in its .env. Keep the line in the form
# image: <registry>/<repo>:${VAR:-<tag>}  so the pipeline can find it.
# (docker-compose.yml in this repo is the build-from-source variant for local/self-hosted use.)
services:
  db:
    image: mariadb:11
    container_name: shipright-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shipright}
      MYSQL_USER: ${MYSQL_USER:-shipright}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - shipright-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: 080632633137.dkr.ecr.us-east-2.amazonaws.com/ship-right/app:${SHIPRIGHT_APP_TAG:-4.4.7}
    container_name: shipright-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SHIPRIGHT__MODE: ${SHIPRIGHT__MODE:-Cloud}
      SHIPRIGHT__TIME_ZONE: ${SHIPRIGHT__TIME_ZONE:-UTC}
      SHIPRIGHT__DB_CONNECTION: ${SHIPRIGHT__DB_CONNECTION:?Set SHIPRIGHT__DB_CONNECTION}
      SHIPRIGHT__CORS_ORIGINS: ${SHIPRIGHT__CORS_ORIGINS:?Set SHIPRIGHT__CORS_ORIGINS}
      SHIPRIGHT__PUBLIC_URL: ${SHIPRIGHT__PUBLIC_URL:?Set SHIPRIGHT__PUBLIC_URL}
      SHIPRIGHT__SMTP_HOST: ${SHIPRIGHT__SMTP_HOST:?Set SHIPRIGHT__SMTP_HOST}
      SHIPRIGHT__SMTP_PORT: ${SHIPRIGHT__SMTP_PORT:-587}
      SHIPRIGHT__SMTP_USERNAME: ${SHIPRIGHT__SMTP_USERNAME:?Set SHIPRIGHT__SMTP_USERNAME}
      SHIPRIGHT__SMTP_PASSWORD: ${SHIPRIGHT__SMTP_PASSWORD:?Set SHIPRIGHT__SMTP_PASSWORD}
      SHIPRIGHT__SMTP_FROM: ${SHIPRIGHT__SMTP_FROM:?Set SHIPRIGHT__SMTP_FROM}
      SHIPRIGHT__GOOGLE_CLIENT_ID: ${SHIPRIGHT__GOOGLE_CLIENT_ID:-}
      SHIPRIGHT__GOOGLE_CLIENT_SECRET: ${SHIPRIGHT__GOOGLE_CLIENT_SECRET:-}
    ports:
      - "5200:5200"
    volumes:
      - shipright-app-data:/root/.shipright

volumes:
  shipright-db-data:
  shipright-app-data:
