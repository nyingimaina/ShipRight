<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ShipRight cloud deployment">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17263E" />
      <stop offset="1" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDD79B" />
      <stop offset="0.55" stop-color="#D4B568" />
      <stop offset="1" stop-color="#C9A84C" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#C9A84C" stop-opacity="0.22" />
      <stop offset="1" stop-color="#C9A84C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />
  <circle cx="256" cy="220" r="196" fill="url(#glow)" />

  <!-- Cloud: the deployment target -->
  <path
    d="M134 300c-36 0-64-26-64-59 0-31 25-56 57-59 9-47 52-82 103-82 56 0 102 42 106 97 29 5 50 29 50 57 0 33-29 60-64 60H134z"
    fill="url(#cloud)"
  />

  <!-- Upward deploy arrow, cut out of the cloud -->
  <path
    d="M256 156v116M209 201l47-45 47 45"
    fill="none"
    stroke="#0B1120"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- A small spark: the playful, "it just shipped" moment -->
  <path
    d="M392 118l6.5 15.5L414 140l-15.5 6.5L392 162l-6.5-15.5L370 140l15.5-6.5z"
    fill="#F0F2F5"
    opacity="0.9"
  />

  <!-- Terminal prompt: a developer tool, not just storage -->
  <path
    d="M170 370l34 29-34 29M240 428h78"
    fill="none"
    stroke="#F0F2F5"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
